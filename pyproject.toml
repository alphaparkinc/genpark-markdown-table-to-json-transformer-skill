[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-markdown-table-to-json-transformer-skill"
version = "1.0.0"
description = "Zero-dependency Markdown table to structured JSON transformer with automated column type inference and format normalization."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GenPark AI", email = "engineering@genpark.ai"}]
keywords = ["ai-agent", "mcp", "web-browsing", "dom-pruning", "zero-dependency"]
dependencies = []

[project.urls]
Homepage = "https://genpark.ai/mcp"
Repository = "https://github.com/alphaparkinc/genpark-markdown-table-to-json-transformer-skill"
